version: 2

models:
  - name: dq_station_element_completeness
    description: Monthly completeness per station and element, relative to inventory expectations.
    data_tests:
      - dbt_utils.expression_is_true:
          name: monitored_series_meet_completeness_threshold
          arguments:
            expression: "not is_below_threshold"
          config:
            where: "is_monitored"
            severity: warn
    columns:
      - name: completeness_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: dq_quality_flag_summary
    description: Counts of NOAA QA-flagged observations in scope, with flag descriptions from readme.txt.
