version: 2

models:
  - name: int_target_stations
    description: Configured stations joined to station metadata, country, inventory and observed coverage.
    columns:
      - name: station_id
        data_tests: [unique, not_null]

  - name: int_analysis_window
    description: The resolved analysis window (single row). Anchor and length come from config.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "window_start <= window_end"
    columns:
      - name: window_end
        data_tests: [not_null]

  - name: int_station_elements_selected
    description: >
      (station, element) pairs in scope, derived from ghcnd-inventory.txt overlapping the
      analysis window and filtered by the configured include/exclude patterns.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, element]
    columns:
      - name: is_documented
        description: False when an element reported by a station is missing from readme.txt.
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
                quote: false
              config:
                severity: warn

  - name: int_daily_observations_scoped
    description: Observations in scope, scaled to physical units, with quality outcome.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, observation_date, element]

unit_tests:
  - name: test_scaling_and_quality_rejection
    description: Values are scaled by the element's factor; any QFLAG rejects the clean value; T = trace.
    model: int_daily_observations_scoped
    overrides:
      vars:
        rejected_qflags: ["*"]
    given:
      - input: ref('stg_ghcnd__daily_observations')
        rows:
          - {station_id: S1, observation_date: 2024-01-01, element: TMAX, raw_value: 253, quality_flag: null, measurement_flag: null}
          - {station_id: S1, observation_date: 2024-01-01, element: PRCP, raw_value: 0, quality_flag: null, measurement_flag: T}
          - {station_id: S1, observation_date: 2024-01-02, element: TMAX, raw_value: 999, quality_flag: X, measurement_flag: null}
          - {station_id: S1, observation_date: 2023-01-01, element: TMAX, raw_value: 100, quality_flag: null, measurement_flag: null}
      - input: ref('int_station_elements_selected')
        rows:
          - {station_id: S1, element: TMAX, scale_factor: 0.1, unit: "°C", element_category: temperature}
          - {station_id: S1, element: PRCP, scale_factor: 0.1, unit: mm, element_category: precipitation}
      - input: ref('int_analysis_window')
        rows:
          - {window_start: 2024-01-01, window_end: 2024-12-31}
      - input: ref('source_unit_corrections')
        rows: []
    expect:
      rows:
        - {observation_date: 2024-01-01, element: TMAX, value: 25.3, value_clean: 25.3, is_quality_rejected: false, is_trace: false}
        - {observation_date: 2024-01-01, element: PRCP, value: 0.0, value_clean: 0.0, is_quality_rejected: false, is_trace: true}
        - {observation_date: 2024-01-02, element: TMAX, value: 99.9, value_clean: null, is_quality_rejected: true, is_trace: false}

  - name: test_source_unit_corrections_override_readme_scale
    description: An (element, source_flag) correction wins over the readme scale factor.
    model: int_daily_observations_scoped
    given:
      - input: ref('stg_ghcnd__daily_observations')
        rows:
          - {station_id: S1, observation_date: 2024-01-01, element: WSFG, raw_value: 600, source_flag: C}
          - {station_id: S1, observation_date: 2024-01-02, element: WSFG, raw_value: 150, source_flag: W}
      - input: ref('int_station_elements_selected')
        rows:
          - {station_id: S1, element: WSFG, scale_factor: 0.1, unit: m/s, element_category: wind}
      - input: ref('int_analysis_window')
        rows:
          - {window_start: 2024-01-01, window_end: 2024-12-31}
      - input: ref('source_unit_corrections')
        rows:
          - {element: WSFG, source_flag: C, scale_factor: 0.0277778, unit: m/s}
    expect:
      rows:
        - {observation_date: 2024-01-01, value: 16.67, is_unit_corrected: true}
        - {observation_date: 2024-01-02, value: 15.0, is_unit_corrected: false}
