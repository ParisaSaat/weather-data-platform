[project]
name = "weather-data-platform"
version = "0.1.0"
description = "Config-driven NOAA GHCN-Daily pipeline: DuckDB + dbt + LLM-generated daily weather narratives."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.10,<2.0",
    "duckdb>=1.3,<2.0",
    "google-genai>=1.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.scripts]
weather = "weather_platform.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913",  # config-heavy constructors are keyword-only anyway
    "PLR0917",
    "PLR2004",
    "PLC0415",  # lazy imports keep `weather --help` fast (dbt/genai are heavy)
]

[tool.ruff.lint.per-file-ignores]
# unicode minus / en dash are matched on purpose: LLMs emit them for negative numbers
"src/weather_platform/narratives/validator.py" = ["RUF001"]
"tests/**" = ["RUF001", "PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that run dbt against a DuckDB file (slower)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
